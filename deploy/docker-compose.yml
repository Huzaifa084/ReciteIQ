name: reciteiq

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reciteiq
      POSTGRES_PASSWORD: reciteiq
      POSTGRES_DB: reciteiq
    ports:
      - "127.0.0.1:19832:5432"   # loopback-only, house convention
    volumes:
      - reciteiq_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reciteiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      # NeMo image. It also carries faster-whisper (same `asr` extras), so the
      # phoneme rollback is a pure env-var change and needs no rebuild — which
      # is the whole point of keeping one image for both engines.
      dockerfile: ${RECITEIQ_BACKEND_DOCKERFILE:-Dockerfile.fastconformer}
    restart: unless-stopped
    environment:
      RECITEIQ_DATABASE_URL: postgresql+psycopg://reciteiq:reciteiq@db:5432/reciteiq
      RECITEIQ_ALLOWED_ORIGINS: '["https://reciteiq.wiserhelpdesk.com"]'
      # ASR engine + secret come from deploy/.env (gitignored). Defaults now
      # select the measured production path; rollback is documented in
      # docs/runbook-engine-rollback.md.
      RECITEIQ_ASR_ENGINE: ${RECITEIQ_ASR_ENGINE:-fastconformer}
      # Empty unless the cloud engine is actually selected. A live credential in
      # a public-facing container that never reads it is pure exposure (S-2).
      RECITEIQ_GROQ_API_KEY: ${RECITEIQ_GROQ_API_KEY:-}
      RECITEIQ_TRACKER_MODE: ${RECITEIQ_TRACKER_MODE:-whisper}
      HF_HOME: /hf
    volumes:
      - ../backend/models:/app/models:ro
      - reciteiq_hf:/hf          # 1.2GB checkpoint survives restarts
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:19843:443"    # edge SNI map routes reciteiq.wiserhelpdesk.com here
    volumes:
      - ./nginx/reciteiq.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx-edge/ssl/wiserhelpdesk.com:/etc/nginx/ssl:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  reciteiq_hf:
  reciteiq_pgdata:
